name: Inbox Monitor

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:  # Manual trigger

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt

      - name: Diagnose environment
        run: |
          python --version
          python -c "import pandas, numpy, sklearn, xgboost; print('All ML packages OK')"
          echo "IMAP_USER set: $([ -n \"$IMAP_USER\" ] && echo 'yes' || echo 'NO — will skip email fetch')"
          echo "SMTP_USER set: $([ -n \"$SMTP_USER\" ] && echo 'yes' || echo 'NO — will use demo mode')"
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          SMTP_USER: ${{ secrets.SMTP_USER }}

      - name: Run inbox monitor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          COMPANY_NAME: ${{ secrets.COMPANY_NAME }}
        run: |
          set -e
          python src/inbox_monitor.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-logs
          path: logs/
          retention-days: 7
