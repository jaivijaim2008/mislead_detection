# fly.toml - Fly.io configuration for Missed-Lead Detector
# Deploy: fly launch && fly deploy

app = "missed-lead-detector"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8501"
  PYTHON_VERSION = "3.11"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
